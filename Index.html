<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RSP Play | เป่าฉุบ</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { 
            --bg: #F2F2F7; 
            --card: #FFFFFF; 
            --text: #1C1C1E; 
            --primary: #000000;
        }
        body { font-family: 'Prompt', sans-serif; background-color: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; padding-bottom: 90px; user-select: none; }
        
        .card-ui { background-color: var(--card); border-radius: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        
        .input-ui { background-color: var(--bg); border: 1px solid #E5E5EA; border-radius: 16px; padding: 14px 16px; width: 100%; outline: none; transition: 0.2s; }
        .input-ui:focus { border-color: var(--text); background-color: #fff; }
        
        .btn-ui { border-radius: 16px; font-weight: 600; padding: 14px; transition: 0.2s; cursor: pointer; text-align: center; border: none; }
        .btn-ui:active { transform: scale(0.96); }

        /* Numpad Style */
        .numpad-btn { background-color: #FFFFFF; border-radius: 16px; font-size: 24px; font-weight: 600; padding: 12px 0; color: #1C1C1E; box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: 0.1s; border: 1px solid #E5E5EA; }
        .numpad-btn:active { background-color: #E5E5EA; transform: scale(0.92); }
        .numpad-action { background-color: #E5E5EA; font-size: 18px; }

        /* Game Weapons */
        .weapon-btn { width: 80px; height: 80px; background: white; border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 2px solid transparent; transition: 0.2s; }
        .weapon-btn.selected { border-color: #000; transform: scale(1.1); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        
        /* Bottom Menu */
        .nav-btn { color: #8E8E93; transition: 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 33.33%; padding: 10px 0; position: relative;}
        .nav-btn.active { color: var(--primary); }
        .nav-btn.active i { transform: translateY(-3px) scale(1.15); }
        
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="loader" class="fixed inset-0 z-[9999] bg-[#F2F2F7] flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="w-12 h-12 border-4 border-gray-200 border-t-black rounded-full animate-spin mb-4"></div>
        <div class="text-sm text-gray-500 font-semibold tracking-wide">กำลังโหลด...</div>
    </div>

    <div id="auth-screen" class="min-h-screen flex items-center justify-center p-6 hidden">
        <div class="w-full max-w-sm text-center">
            <div class="w-20 h-20 bg-black text-white rounded-3xl flex items-center justify-center mx-auto mb-6 text-4xl shadow-xl"><i class="fas fa-hand-peace"></i></div>
            <h2 class="text-3xl font-extrabold mb-1 tracking-tight">RSP <span class="text-blue-600">Play</span></h2>
            <p class="text-gray-500 text-sm mb-8 font-medium">เข้าสู่ระบบเพื่อเริ่มทำกำไร</p>
            
            <div class="space-y-3">
                <input type="email" id="email" placeholder="อีเมลของคุณ" class="input-ui text-center font-medium">
                <input type="password" id="pass" placeholder="รหัสผ่าน" class="input-ui text-center font-medium">
                <input type="text" id="name" placeholder="ชื่อเล่น (เฉพาะสมัครใหม่)" class="input-ui text-center font-medium hidden">
                
                <button id="btn-login" onclick="login()" class="btn-ui bg-black text-white w-full shadow-lg py-4 text-lg mt-2">เข้าสู่ระบบ</button>
                <button id="btn-register" onclick="register()" class="btn-ui bg-blue-600 text-white w-full shadow-lg py-4 text-lg hidden mt-2">สมัครสมาชิก</button>
            </div>
            
            <p class="mt-6 text-sm text-gray-500">
                <span id="auth-toggle-text">ยังไม่มีบัญชีใช่ไหม?</span> 
                <button onclick="toggleAuth()" class="text-black font-bold underline">คลิกที่นี่</button>
            </p>
        </div>
    </div>

    <div id="app-screen" class="hidden max-w-md mx-auto pt-6 px-5">
        
        <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-3xl shadow-sm border border-gray-100">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-gray-100 rounded-full flex items-center justify-center text-gray-500 text-lg font-bold" id="user-avatar">U</div>
                <div>
                    <p class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">ยินดีต้อนรับ</p>
                    <h2 class="text-lg font-black text-black leading-tight truncate w-32" id="user-name">...</h2>
                </div>
            </div>
            <div class="text-right bg-[#F2F2F7] py-2 px-4 rounded-2xl">
                <p class="text-[9px] text-gray-500 font-bold uppercase">ยอดเงินคงเหลือ</p>
                <p class="font-black text-black text-lg">฿ <span id="user-bal">0.00</span></p>
            </div>
        </div>

        <div id="tab-play" class="tab-content active">
            <div class="card-ui p-5 mb-5 text-center">
                <h3 class="font-bold text-gray-500 text-sm mb-4 uppercase tracking-wider">เลือกอาวุธของคุณ</h3>
                <div class="flex justify-center gap-4 mb-2">
                    <button onclick="selectWeapon('rock')" id="w-rock" class="weapon-btn"><i class="fas fa-hand-back-fist text-gray-700"></i></button>
                    <button onclick="selectWeapon('paper')" id="w-paper" class="weapon-btn"><i class="fas fa-hand text-gray-700"></i></button>
                    <button onclick="selectWeapon('scissors')" id="w-scissors" class="weapon-btn"><i class="fas fa-hand-scissors text-gray-700"></i></button>
                </div>
                <p class="text-[10px] text-red-500 font-bold hidden mt-2" id="weapon-error">* กรุณาเลือกอาวุธก่อนลงเดิมพัน</p>
            </div>

            <div class="card-ui p-5 bg-white">
                <div class="flex justify-between items-end mb-4 bg-[#F2F2F7] p-4 rounded-2xl border border-gray-200">
                    <div>
                        <p class="text-[10px] font-bold text-gray-400 uppercase">จำนวนเงินเดิมพัน</p>
                        <p class="text-3xl font-black text-black mt-1">฿ <span id="bet-display">0</span></p>
                    </div>
                    <button onclick="clearBet()" class="text-xs font-bold text-red-500 bg-red-50 px-3 py-1.5 rounded-lg active:scale-95 transition">ล้าง (C)</button>
                </div>

                <div class="grid grid-cols-3 gap-3 mb-4">
                    <button onclick="addBet('1')" class="numpad-btn">1</button>
                    <button onclick="addBet('2')" class="numpad-btn">2</button>
                    <button onclick="addBet('3')" class="numpad-btn">3</button>
                    <button onclick="addBet('4')" class="numpad-btn">4</button>
                    <button onclick="addBet('5')" class="numpad-btn">5</button>
                    <button onclick="addBet('6')" class="numpad-btn">6</button>
                    <button onclick="addBet('7')" class="numpad-btn">7</button>
                    <button onclick="addBet('8')" class="numpad-btn">8</button>
                    <button onclick="addBet('9')" class="numpad-btn">9</button>
                    <button onclick="addBet('00')" class="numpad-btn numpad-action font-bold">00</button>
                    <button onclick="addBet('0')" class="numpad-btn">0</button>
                    <button onclick="delBet()" class="numpad-btn numpad-action text-red-500"><i class="fas fa-backspace"></i></button>
                </div>

                <div class="grid grid-cols-4 gap-2 mb-4">
                    <button onclick="addBetVal(10)" class="bg-blue-50 text-blue-600 text-[11px] font-bold py-2 rounded-xl border border-blue-100">+10</button>
                    <button onclick="addBetVal(50)" class="bg-blue-50 text-blue-600 text-[11px] font-bold py-2 rounded-xl border border-blue-100">+50</button>
                    <button onclick="addBetVal(100)" class="bg-blue-50 text-blue-600 text-[11px] font-bold py-2 rounded-xl border border-blue-100">+100</button>
                    <button onclick="setAllIn()" class="bg-black text-white text-[11px] font-bold py-2 rounded-xl">All In</button>
                </div>

                <button onclick="playGame()" class="btn-ui bg-black text-white w-full py-4 text-lg shadow-lg flex items-center justify-center gap-2">
                    <i class="fas fa-play"></i> เริ่มเดิมพัน
                </button>
            </div>
        </div>

        <div id="tab-wallet" class="tab-content">
            <div class="bg-gradient-to-br from-black to-gray-800 text-white rounded-[28px] p-6 shadow-xl mb-6 relative overflow-hidden">
                <div class="absolute -right-4 -bottom-4 text-white/10 text-8xl"><i class="fas fa-wallet"></i></div>
                <p class="text-[11px] text-gray-300 font-bold uppercase tracking-wider mb-1 relative z-10">ยอดเงินที่สามารถถอนได้</p>
                <h3 class="text-4xl font-black mb-6 relative z-10">฿ <span id="withdraw-bal-show">0.00</span></h3>
                <div class="flex gap-2 relative z-10">
                    <div class="bg-white/20 px-3 py-1 rounded-lg text-[10px] font-mono border border-white/10">ID: <span id="w-uid">...</span></div>
                </div>
            </div>

            <div class="card-ui p-5 mb-6">
                <h3 class="font-bold text-black text-sm mb-4"><i class="fas fa-building-columns text-blue-500 mr-1"></i> แจ้งถอนเงินเข้าบัญชี</h3>
                <div class="space-y-3">
                    <input type="number" id="w-amount" placeholder="ระบุจำนวนเงินที่ต้องการถอน (฿)" class="input-ui font-bold text-lg">
                    <input type="text" id="w-bank" placeholder="ชื่อธนาคาร (เช่น KBank, SCB)" class="input-ui">
                    <input type="text" id="w-acc" placeholder="เลขที่บัญชี" class="input-ui font-mono">
                    <button onclick="requestWithdraw()" class="btn-ui bg-black text-white w-full py-4 shadow-md mt-2">ยืนยันการถอนเงิน</button>
                </div>
            </div>

            <h3 class="font-bold text-gray-500 text-xs mb-3 px-2 uppercase">ประวัติการถอนล่าสุด</h3>
            <div id="withdraw-history" class="space-y-3 pb-6">
                </div>
        </div>

        <div id="tab-profile" class="tab-content">
            <div class="card-ui p-6 mb-4 text-center">
                <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center text-gray-400 text-3xl font-bold mx-auto mb-3" id="p-avatar">U</div>
                <h2 class="text-xl font-black text-black mb-1" id="p-name">...</h2>
                <p class="text-xs text-gray-400 font-mono bg-gray-50 inline-block px-3 py-1 rounded-lg border border-gray-100">UID: <span id="p-uid">...</span></p>
            </div>

            <div class="card-ui overflow-hidden mb-6">
                <button onclick="contactAdmin()" class="w-full flex justify-between items-center p-5 bg-white border-b border-gray-100 hover:bg-gray-50 transition active:bg-gray-100">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 bg-blue-50 text-blue-500 rounded-xl flex items-center justify-center text-lg"><i class="fab fa-facebook-messenger"></i></div>
                        <div class="text-left">
                            <p class="font-bold text-black text-sm">ติดต่อแอดมิน</p>
                            <p class="text-[10px] text-gray-400">แจ้งปัญหา / เติมเงิน</p>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-gray-300 text-sm"></i>
                </button>
                
                <button onclick="auth.signOut()" class="w-full flex justify-between items-center p-5 bg-white hover:bg-red-50 transition active:bg-red-100 group">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 bg-red-50 text-red-500 rounded-xl flex items-center justify-center text-lg group-hover:bg-red-100 transition"><i class="fas fa-power-off"></i></div>
                        <div class="text-left">
                            <p class="font-bold text-red-600 text-sm">ออกจากระบบ</p>
                        </div>
                    </div>
                </button>
            </div>
        </div>

    </div>

    <nav id="nav-bar" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-[400px] bg-white/90 backdrop-blur-xl border border-white/50 rounded-[28px] flex items-center justify-between p-2 shadow-[0_10px_40px_rgba(0,0,0,0.08)] z-40">
        <button onclick="switchTab('play')" class="nav-btn active" id="btn-play">
            <i class="fas fa-gamepad text-xl mb-1"></i>
            <span class="text-[9px] font-bold">เล่นเกม</span>
        </button>
        <button onclick="switchTab('wallet')" class="nav-btn" id="btn-wallet">
            <i class="fas fa-wallet text-xl mb-1"></i>
            <span class="text-[9px] font-bold">กระเป๋า</span>
        </button>
        <button onclick="switchTab('profile')" class="nav-btn" id="btn-profile">
            <i class="fas fa-user text-xl mb-1"></i>
            <span class="text-[9px] font-bold">ฉัน</span>
        </button>
    </nav>

    <script>
        // 1. Firebase Setup (ใส่ Config ของคุณ)
        const firebaseConfig = { apiKey: "AIzaSyDaeVJ1mUxjm1gG4GMTfZyqJsjImiISzPI", projectId: "gaga-1eb83" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();

        let currentUser = null;
        let userData = null;
        let isLoginMode = true;
        let adminContactUrl = "";

        // ตัวแปรสำหรับเกม
        let selectedWeapon = null;
        let currentBet = "0";

        const Toast = Swal.mixin({ toast: true, position: 'top', showConfirmButton: false, timer: 2000, background: '#1C1C1E', color: '#fff', customClass: { popup: 'rounded-2xl' } });

        // ปิด Loader
        setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 1000);

        // 2. Auth State
        auth.onAuthStateChanged(user => {
            document.getElementById('loader').style.display = 'none';
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                document.getElementById('nav-bar').classList.remove('hidden');
                
                fetchUserData();
                fetchAdminContact();
                fetchWithdrawHistory();
                switchTab('play');
            } else {
                currentUser = null; userData = null;
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-screen').classList.add('hidden');
                document.getElementById('nav-bar').classList.add('hidden');
            }
        });

        // --- ระบบ Login / Register ---
        function toggleAuth() {
            isLoginMode = !isLoginMode;
            document.getElementById('name').classList.toggle('hidden', isLoginMode);
            document.getElementById('btn-login').classList.toggle('hidden', !isLoginMode);
            document.getElementById('btn-register').classList.toggle('hidden', isLoginMode);
            document.getElementById('auth-toggle-text').innerText = isLoginMode ? "ยังไม่มีบัญชีใช่ไหม?" : "มีบัญชีอยู่แล้ว?";
        }

        async function login() {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value;
            if(!e || !p) return Toast.fire({ icon: 'warning', title: 'กรอกข้อมูลให้ครบ' });
            Swal.showLoading();
            try { await auth.signInWithEmailAndPassword(e, p); Swal.close(); } 
            catch (err) { Swal.fire({ icon: 'error', title: 'เข้าสู่ระบบล้มเหลว', text:'อีเมลหรือรหัสผิด', customClass: { popup: 'rounded-3xl', confirmButton: 'btn-ui bg-black text-white' }}); }
        }

        async function register() {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value, n = document.getElementById('name').value;
            if(!e || !p || !n) return Toast.fire({ icon: 'warning', title: 'กรอกข้อมูลให้ครบ' });
            Swal.showLoading();
            try {
                const cred = await auth.createUserWithEmailAndPassword(e, p);
                // สร้างข้อมูล User ใน Firestore (Default เงิน 0, winRate 35)
                await db.collection('users').doc(cred.user.uid).set({ name: n, email: e, balance: 0, role: 'user', winRate: 35, createdAt: new Date() });
                Swal.close(); Toast.fire({ icon: 'success', title: 'สมัครสมาชิกสำเร็จ!' });
            } catch (err) { Swal.fire({ icon: 'error', title: 'สมัครล้มเหลว', text: err.message, customClass: { popup: 'rounded-3xl' } }); }
        }

        // --- Fetch Data ---
        function fetchUserData() {
            if(!currentUser) return;
            db.collection('users').doc(currentUser.uid).onSnapshot(doc => {
                if(doc.exists) {
                    userData = doc.data();
                    const bal = (userData.balance || 0);
                    const balStr = bal.toLocaleString('en-US', {minimumFractionDigits: 2});
                    
                    // อัปเดต UI ทั่วไป
                    document.getElementById('user-name').innerText = userData.name;
                    document.getElementById('p-name').innerText = userData.name;
                    document.getElementById('user-avatar').innerText = userData.name.charAt(0).toUpperCase();
                    document.getElementById('p-avatar').innerText = userData.name.charAt(0).toUpperCase();
                    document.getElementById('p-uid').innerText = currentUser.uid.substring(0,8)+'...';
                    document.getElementById('w-uid').innerText = currentUser.uid.substring(0,8);
                    
                    // อัปเดตเงิน
                    document.getElementById('user-bal').innerText = balStr;
                    document.getElementById('withdraw-bal-show').innerText = balStr;
                }
            });
        }

        async function fetchAdminContact() {
            const doc = await db.collection('settings').doc('contact').get();
            if(doc.exists && doc.data().facebookUrl) {
                adminContactUrl = doc.data().facebookUrl;
            }
        }

        function contactAdmin() {
            if(adminContactUrl) {
                window.open(adminContactUrl, '_blank');
            } else {
                Swal.fire({ icon: 'info', title: 'ติดต่อเรา', text: 'แอดมินยังไม่ได้ตั้งค่าลิงก์ติดต่อ', customClass: { popup: 'rounded-3xl', confirmButton: 'btn-ui bg-black text-white' }});
            }
        }

        // --- Navigation ---
        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-'+t).classList.add('active');
            document.getElementById('btn-'+t).classList.add('active');
        }

        // --- ระบบเกม & Numpad ---
        function selectWeapon(w) {
            selectedWeapon = w;
            document.querySelectorAll('.weapon-btn').forEach(btn => btn.classList.remove('selected'));
            document.getElementById('w-'+w).classList.add('selected');
            document.getElementById('weapon-error').classList.add('hidden');
        }

        function updateBetDisplay() {
            let num = parseInt(currentBet);
            if(isNaN(num)) num = 0;
            document.getElementById('bet-display').innerText = num.toLocaleString();
        }

        function addBet(val) {
            if(currentBet === "0" && val !== "0" && val !== "00") currentBet = val;
            else if (currentBet.length < 7) currentBet += val; // จำกัดความยาว
            updateBetDisplay();
        }

        function addBetVal(val) {
            let num = parseInt(currentBet);
            if(isNaN(num)) num = 0;
            currentBet = (num + val).toString();
            updateBetDisplay();
        }

        function delBet() {
            if(currentBet.length > 1) currentBet = currentBet.slice(0, -1);
            else currentBet = "0";
            updateBetDisplay();
        }

        function clearBet() {
            currentBet = "0";
            updateBetDisplay();
        }

        function setAllIn() {
            if(userData && userData.balance > 0) {
                currentBet = Math.floor(userData.balance).toString();
                updateBetDisplay();
            }
        }

        async function playGame() {
            if(!selectedWeapon) { document.getElementById('weapon-error').classList.remove('hidden'); return; }
            const betAmt = parseInt(currentBet);
            if(!betAmt || betAmt <= 0) return Toast.fire({ icon: 'warning', title: 'ระบุยอดเดิมพัน' });
            if(betAmt > userData.balance) return Toast.fire({ icon: 'error', title: 'ยอดเงินไม่พอ' });

            Swal.showLoading();
            
            // 1. หักเงินก่อน
            const userRef = db.collection('users').doc(currentUser.uid);
            await userRef.update({ balance: firebase.firestore.FieldValue.increment(-betAmt) });

            // 2. คำนวณผล (ใช้ winRate จาก DB)
            const winRate = userData.winRate || 35; // ถ้าไม่มีให้ 35%
            const rand = Math.random() * 100;
            let result = '';
            let wonAmt = 0;
            
            // Logic ง่ายๆ: 
            // - ถ้าสุ่มได้เลข < winRate = ชนะ (ได้กำไร 1 เท่า)
            // - นอกนั้น: สุ่มว่าจะเสมอ (คืนทุน) หรือแพ้ (เสียเงิน)
            if(rand < winRate) {
                result = 'win'; wonAmt = betAmt * 2;
            } else {
                result = Math.random() < 0.3 ? 'draw' : 'lose'; // โอกาสเสมอ 30% ของตอนที่ไม่ชนะ
                if(result === 'draw') wonAmt = betAmt; // คืนทุน
            }

            // 3. เพิ่มเงินถ้าชนะหรือเสมอ
            if(wonAmt > 0) {
                await userRef.update({ balance: firebase.firestore.FieldValue.increment(wonAmt) });
            }

            // 4. บันทึกประวัติลงตาราง plays (สำหรับให้แอดมินดู)
            await db.collection('plays').add({
                uid: currentUser.uid, name: userData.name,
                weapon: selectedWeapon, bet: betAmt, result: result, winAmount: wonAmt,
                timestamp: new Date()
            });

            // 5. แสดงผลลัพธ์
            setTimeout(() => {
                if(result === 'win') {
                    Swal.fire({ icon: 'success', title: 'ชนะเลิศ!', text: `คุณได้รับ ฿${wonAmt.toLocaleString()}`, customClass: { popup: 'rounded-3xl', confirmButton: 'btn-ui bg-black text-white px-8' } });
                } else if(result === 'draw') {
                    Swal.fire({ icon: 'info', title: 'เสมอ!', text: 'คืนทุนเดิมพันให้คุณ', customClass: { popup: 'rounded-3xl', confirmButton: 'btn-ui bg-black text-white px-8' } });
                } else {
                    Swal.fire({ icon: 'error', title: 'คุณแพ้!', text: 'ลองใหม่อีกครั้งนะ', customClass: { popup: 'rounded-3xl', confirmButton: 'btn-ui bg-black text-white px-8' } });
                }
            }, 800);
        }

        // --- ระบบถอนเงิน ---
        async function requestWithdraw() {
            const amt = Number(document.getElementById('w-amount').value);
            const bank = document.getElementById('w-bank').value;
            const acc = document.getElementById('w-acc').value;

            if(!amt || amt < 100) return Toast.fire({ icon: 'warning', title: 'ถอนขั้นต่ำ 100 บาท' });
            if(!bank || !acc) return Toast.fire({ icon: 'warning', title: 'กรอกข้อมูลบัญชีให้ครบ' });
            if(amt > userData.balance) return Toast.fire({ icon: 'error', title: 'ยอดเงินไม่พอให้ถอน' });

            Swal.fire({
                title: 'ยืนยันการถอนเงิน?', text: `จำนวน ฿${amt.toLocaleString()}`,
                showCancelButton: true, confirmButtonText: 'ยืนยัน', cancelButtonText: 'ยกเลิก',
                customClass: { popup: 'rounded-3xl', confirmButton: 'btn-ui bg-black text-white px-6', cancelButton: 'btn-ui bg-gray-200 text-black px-6 ml-2' }
            }).then(async (res) => {
                if(res.isConfirmed) {
                    Swal.showLoading();
                    try {
                        // 1. หักเงินในบัญชีลูกค้าทันที
                        await db.collection('users').doc(currentUser.uid).update({ balance: firebase.firestore.FieldValue.increment(-amt) });
                        
                        // 2. สร้างรายการใน transactions เพื่อให้แอดมินเห็น
                        const now = new Date();
                        const dateStr = now.toLocaleDateString('th-TH') + ' ' + now.toLocaleTimeString('th-TH');
                        await db.collection('transactions').add({
                            uid: currentUser.uid, name: userData.name,
                            amount: amt, status: 'pending',
                            details: `ธนาคาร: ${bank} | เลขบัญชี: ${acc}`,
                            dateStr: dateStr, localTime: now.getTime()
                        });
                        
                        document.getElementById('w-amount').value = '';
                        document.getElementById('w-bank').value = '';
                        document.getElementById('w-acc').value = '';
                        Swal.fire({ icon: 'success', title: 'ส่งคำขอถอนเงินแล้ว!', text: 'กรุณารอแอดมินดำเนินการ', customClass: { popup: 'rounded-3xl', confirmButton: 'btn-ui bg-black text-white px-8' } });
                    } catch (e) {
                        Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: e.message, customClass: { popup: 'rounded-3xl' } });
                    }
                }
            });
        }

        function fetchWithdrawHistory() {
            db.collection('transactions').where('uid', '==', currentUser.uid).orderBy('localTime', 'desc').limit(10).onSnapshot(snap => {
                const list = document.getElementById('withdraw-history');
                list.innerHTML = '';
                
                if(snap.empty) { list.innerHTML = `<p class="text-center py-6 text-gray-400 text-sm">ยังไม่มีประวัติการถอน</p>`; return; }

                snap.forEach(doc => {
                    const d = doc.data();
                    let stHtml = '';
                    if(d.status === 'pending') stHtml = `<span class="text-[9px] font-bold bg-yellow-100 text-yellow-600 px-2 py-0.5 rounded-md">กำลังตรวจสอบ</span>`;
                    else if(d.status === 'approved') stHtml = `<span class="text-[9px] font-bold bg-green-100 text-green-600 px-2 py-0.5 rounded-md">โอนสำเร็จ</span>`;
                    else stHtml = `<span class="text-[9px] font-bold bg-red-100 text-red-600 px-2 py-0.5 rounded-md">ถูกยกเลิก (คืนเงิน)</span>`;

                    list.innerHTML += `
                        <div class="card-ui p-4 bg-white flex justify-between items-center border border-gray-50">
                            <div class="flex gap-3 items-center">
                                <div class="w-10 h-10 bg-[#F2F2F7] rounded-xl flex items-center justify-center text-gray-400"><i class="fas fa-money-bill-transfer"></i></div>
                                <div>
                                    <p class="font-bold text-black text-sm">ถอนเงิน</p>
                                    <p class="text-[9px] text-gray-400 mt-0.5">${d.dateStr}</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="font-black text-black text-sm mb-1">฿${d.amount.toLocaleString()}</p>
                                ${stHtml}
                            </div>
                        </div>
                    `;
                });
            });
        }
    </script>
</body>
</html>
